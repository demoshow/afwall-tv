name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (for example v1.0.0-tv)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::A tag is required. Push a v* tag or pass the tag input."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify the tag exists
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null
          git describe --tags --exact-match

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Verify repository hygiene
        run: git diff --check

      - name: Verify TV resources
        run: python3 scripts/verify_tv_resources.py

      - name: Test, lint and build unsigned release
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon \
            -PversionName="${{ steps.version.outputs.version }}"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is not configured}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is not configured}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is not configured}"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          KEYSTORE_TYPE="${ANDROID_KEYSTORE_TYPE:-PKCS12}"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-type "$KEYSTORE_TYPE" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out "afwall-tv-${{ steps.version.outputs.version }}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "afwall-tv-${{ steps.version.outputs.version }}.apk"

      - name: Build corresponding source archive
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=afwall-tv/ \
            --output="afwall-tv-${{ steps.version.outputs.version }}-source.zip" \
            "${{ steps.version.outputs.tag }}"

      - name: Compute checksums
        run: |
          set -euo pipefail
          sha256sum \
            "afwall-tv-${{ steps.version.outputs.version }}.apk" \
            "afwall-tv-${{ steps.version.outputs.version }}-source.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # AFWall TV __VERSION__

          Unofficial TV adaptation of [AFWall+](https://github.com/ukanth/afwall).
          Not an official AFWall+ release and not affiliated with the upstream
          maintainers.

          ## Upstream / 上游

          - Base: `acfebf0f04c807acd7fe80b27d09c04e9b581e74` (upstream `beta`, after v5.0.0)
          - Source tag: `__TAG__`
          - Source commit: `__SHA__`

          ## Corresponding source / 对应源码

          The complete source for this release is the Git tag above and the attached
          source archive. License: GPL-3.0; see `LICENSE`, `NOTICE.md`,
          `THIRD_PARTY.md` and `LICENSES/`. Native helper sources are under
          `third_party/sources/`.

          ## Changes / 变更

          - TV-first three-policy UI (normal / LAN-only / blocked) and D-pad navigation.
          - TV identity: application ID `io.github.demoshow.afwalltv`, Java namespace unchanged.
          - English/Chinese resources, tests, documentation and release automation.

          ## Requirements / 要求

          - Root required.
          - Android 7.0 / API 24 or newer.
          - Do **not** enable this app and upstream AFWall+ at the same time; the
            inherited iptables chains are shared. Disable one before enabling the other.
          - A different application ID does not migrate preferences, root grants or
            Tasker actions from other builds.

          ## Verification / 验证

          - CI ran unit tests, lint and the release build for this tag.
          - CI does not test real device root prompts, D-pad hardware or IPv4/IPv6
            isolation; see `docs/TESTING.md` for manual acceptance.
          - APK and source SHA-256 values are in `SHA256SUMS`.
          EOF
          sed -i \
            -e "s/__VERSION__/${{ steps.version.outputs.version }}/g" \
            -e "s/__TAG__/${{ steps.version.outputs.tag }}/g" \
            -e "s/__SHA__/${{ github.sha }}/g" \
            release-notes.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: afwall-tv-${{ steps.version.outputs.version }}
          path: |
            afwall-tv-*.apk
            afwall-tv-*-source.zip
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "afwall-tv-$VERSION.apk" \
              "afwall-tv-$VERSION-source.zip" \
              SHA256SUMS --clobber
            gh release edit "$TAG" \
              --title "AFWall TV $VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              "afwall-tv-$VERSION.apk" \
              "afwall-tv-$VERSION-source.zip" \
              SHA256SUMS \
              --verify-tag \
              --title "AFWall TV $VERSION" \
              --notes-file release-notes.md
          fi
